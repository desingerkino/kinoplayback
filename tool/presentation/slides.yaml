# Презентация KINO PLAYBACK для клиента.
# Правится прямо в браузере на GitHub (значок карандаша). После сохранения
# (commit) видео пересобирается само: Actions -> "Presentation video" -> Artifacts.
#
# Поля слайда:
#   kind:   title | bullets
#   title:  заголовок на экране
#   sub:    подзаголовок (для kind: title)
#   bullets: список коротких строк на экране (для kind: bullets)
#   say:    текст, который читает диктор. Пиши так, как говорят вслух:
#           числа и сокращения словами, без лишних скобок.

voice: ru-RU-DmitryNeural   # мужской голос (женский: ru-RU-SvetlanaNeural)
rate: "-4%"                 # скорость речи: -10% медленнее, +10% быстрее

slides:
  - kind: title
    title: KINO PLAYBACK
    sub: Монитор для съёмочной площадки
    say: >
      Кино Плейбэк. Монитор для съёмочной площадки. Живой кадр с камеры
      на экране режиссёра и управление записью по обычной Вай-Фай сети.

  - kind: bullets
    title: Задача
    bullets:
      - Режиссёр видит кадр, не подходя к камере
      - Запись запускается с монитора
      - Без проводов, облака и аккаунтов
    say: >
      На площадке режиссёру нужно видеть кадр, не подходя к камере, и
      запускать запись прямо с монитора. Для этого не нужны ни провода,
      ни облако, ни аккаунты.

  - kind: bullets
    title: Как это работает
    bullets:
      - Телефон в режиме CAMERA снимает и пишет оригинал
      - Планшет или телефон в режиме PLAYBACK показывает живую картинку
      - Связь только по локальной Wi-Fi сети
      - iPhone, iPad, Android-телефоны и планшеты
    say: >
      Телефон в режиме Камера снимает и пишет оригинал. Планшет или
      телефон режиссёра в режиме Плейбэк показывает живую картинку по
      локальной сети. Приложение работает на айфонах, айпадах и на
      устройствах с Андроидом, и каждое устройство может играть любую роль.

  - kind: bullets
    title: Подключение
    bullets:
      - Оба устройства в одной Wi-Fi сети
      - Камера находится автоматически, или по QR-коду, или по IP-адресу
      - Каждое новое устройство подтверждается на камере
    say: >
      Оба устройства подключаются к одной сети. Камера находится
      автоматически, а если не нашлась, подойдёт QR-код или адрес.
      Каждое новое устройство нужно подтвердить на самой камере,
      поэтому чужой монитор не подключится незаметно.

  - kind: bullets
    title: Удалённая запись
    bullets:
      - Большая красная кнопка REC на мониторе
      - Индикатор горит только после подтверждения камеры
      - При обрыве связи запись на камере не прерывается
    say: >
      Кнопка записи на мониторе запускает и останавливает запись на
      камере. Индикатор загорается только тогда, когда камера
      подтвердила, что запись действительно идёт. А если связь
      оборвётся, камера продолжит писать оригинал.

  - kind: bullets
    title: Инструменты монитора
    bullets:
      - Направляющие и кашетирование
      - Зебра, False Color, гистограмма
      - Режимы Fit и Fill
      - Чистый кадр на внешний экран
    say: >
      На мониторе есть направляющие и кашетирование, зебра, фальш-колор
      и гистограмма. Чистый кадр без интерфейса можно вывести на
      внешний экран.

  - kind: bullets
    title: Управление камерой
    bullets:
      - Фокус и экспозиция касанием по кадру
      - Зум жестом
      - Синхронизация наклона кадра с камерой
      - Отдельное разрешение на удалённое управление
    say: >
      Фокус и экспозицию можно задать касанием по кадру, а зум жестом.
      Наклон кадра синхронизируется с камерой. Удалённое управление
      включается отдельным разрешением на камере.

  - kind: bullets
    title: Приватность
    bullets:
      - Только локальная сеть
      - Видео и команды шифруются
      - Данные не уходят в интернет
    say: >
      Всё работает только внутри вашей сети. Видео и команды
      шифруются, а данные никуда не уходят в интернет.

  - kind: bullets
    title: Оборудование
    bullets:
      - Каталог передатчиков VAXIS и Accsoon внутри приложения
      - Приёмник с UVC-выходом подключается к iPad как камера
      - Физическая проверка на оборудовании ещё впереди
    say: >
      В приложении есть каталог видеопередатчиков Ваксис и Аксун.
      Приёмник с юви-си выходом можно подключить к айпаду как внешнюю
      камеру. Проверка на реальном оборудовании у нас ещё впереди, и мы
      честно отмечаем это в каталоге.

  - kind: bullets
    title: Что дальше
    bullets:
      - Нативный модуль записи с высоким битрейтом
      - Расширенные настройки камеры
      - Проверка совместимости на площадке
    say: >
      Дальше мы планируем нативный модуль записи с высоким битрейтом,
      расширенные настройки камеры и проверку совместимости с
      оборудованием на реальной площадке.

  - kind: title
    title: Спасибо
    sub: KINO PLAYBACK
    say: >
      Спасибо за внимание. Буду рад ответить на вопросы.
