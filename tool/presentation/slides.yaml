# Презентация KINO PLAYBACK для клиента (оператор / режиссёр, цель: согласие на пилот).
# Правится прямо в браузере на GitHub (значок карандаша). Бриф и критерии: SPEC.md.
# После сохранения в ветке presentation/video видео пересобирается само:
# Actions -> "Presentation video" -> Artifacts.
#
# Поля слайда:
#   kind:    title | bullets | scene
#   title:   заголовок на экране (title, bullets)
#   sub:     подзаголовок (для kind: title)
#   bullets: список коротких строк на экране (для kind: bullets)
#   scene:   camera | playback | split (для kind: scene)
#   walk:    сколько секунд «прогулки» по городу прошло до этой сцены
#   rec_at:  секунда сцены, когда включается индикатор записи (split)
#   say:     текст диктора. Пиши так, как говорят вслух: числа и английские
#            слова русскими буквами. Каждая фраза превращается в субтитр.
#   src:     из какого файла репозитория взяты факты слайда

voice: ru-RU-DmitryNeural   # мужской голос (женский: ru-RU-SvetlanaNeural)
rate: "-4%"                 # скорость речи: -10% медленнее, +10% быстрее

slides:
  - kind: title
    title: KINO PLAYBACK
    sub: Монитор для съёмочной площадки
    say: >
      Кино Плейбэк. Монитор для съёмочной площадки. Живой кадр с камеры
      на экране режиссёра и управление записью по обычной вай-фай сети.

  - kind: bullets
    title: Задача
    src: README.md
    bullets:
      - Режиссёр видит кадр, не подходя к камере
      - Запись запускается с монитора
      - Без проводов, облака и аккаунтов
    say: >
      Режиссёру нужно видеть кадр, не подходя к камере, и запускать запись
      прямо с монитора. Для этого не нужны ни провода, ни облако,
      ни аккаунты.

  - kind: scene
    scene: camera
    walk: 0
    src: README.md
    say: >
      Вот как это выглядит. Актёр идёт по Москве с телефоном в режиме Камера.
      Телефон снимает и пишет оригинал. Справа большая красная кнопка записи,
      слева сетка и подключение по кью-ар коду, внизу фокус, экспозиция и зум.

  - kind: scene
    scene: playback
    walk: 15
    src: README.md
    say: >
      Планшет режиссёра в режиме Плейбэк показывает ту же картинку вживую.
      Слева инструменты монитора: сетка, зебра, фальш колор, гистограмма
      и фокус. Справа рамки кадра, режимы Фит и Филл. Внизу кнопка записи
      камеры.

  - kind: scene
    scene: split
    walk: 30
    rec_at: 9.5
    src: README.md
    say: >
      А теперь вместе. Актёр снимает на телефон, а режиссёр видит тот же кадр
      на планшете по обычной вай-фай сети, без проводов и облака. Кнопкой на
      планшете он запускает запись на камере. Индикатор загорается только
      после подтверждения от самой камеры.

  - kind: bullets
    title: Подключение
    src: README.md
    bullets:
      - Оба устройства в одной Wi-Fi сети, подойдёт и точка доступа на телефоне
      - Камера находится автоматически, по QR-коду или по IP-адресу
      - Каждое новое устройство подтверждается на камере
    say: >
      Оба устройства подключаются к одной сети, подойдёт даже точка доступа
      на телефоне. Камера находится автоматически, а если нет, помогут
      кью-ар код или адрес. Каждое новое устройство нужно подтвердить
      на самой камере.

  - kind: bullets
    title: Инструменты и управление
    src: docs/ARCHITECTURE.md
    bullets:
      - Направляющие, кашетирование, режимы Fit и Fill
      - Зебра, False Color, гистограмма
      - Фокус, экспозиция и зум касанием по кадру
      - Чистый кадр на внешний экран
      - При обрыве связи камера продолжает писать оригинал
    say: >
      На мониторе есть направляющие, кашетирование, зебра, фальш колор
      и гистограмма. Фокус, экспозицию и зум можно задать касанием
      по кадру, если на камере включено удалённое управление. Чистый кадр
      выводится на внешний экран. А если связь оборвётся, камера
      продолжит писать оригинал.

  - kind: bullets
    title: Оборудование
    src: docs/HARDWARE.md
    bullets:
      - Каталог передатчиков VAXIS и Accsoon внутри приложения
      - Приёмник с UVC-выходом подключается к iPad как камера
      - Физическая проверка на оборудовании ещё впереди
    say: >
      В приложении есть каталог видеопередатчиков Ваксис и Аксун. Приёмник
      с юви-си выходом можно подключить к айпаду как внешнюю камеру.
      Физическая проверка на оборудовании ещё впереди, и мы честно
      отмечаем это в каталоге.

  - kind: title
    title: Спасибо
    sub: Предлагаю пилот на одной съёмочной площадке
    say: >
      Спасибо за внимание. Предлагаю пилот на одной съёмочной площадке.
      Напишите, и договоримся о дате.
