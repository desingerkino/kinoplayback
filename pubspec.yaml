name: kinoplayback
description: "KINO PLAYBACK — CAMERA → PLAYBACK cinema monitor over local Wi-Fi (iOS / Android)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Video transport (WebRTC: DTLS-SRTP media, data channel for control)
  flutter_webrtc: ">=0.12.0 <2.0.0"
  # Bonjour / NSD discovery on the LAN
  bonsoir: ^7.1.5
  # QR pairing
  mobile_scanner: ">=5.2.0 <8.0.0"
  qr_flutter: ^4.1.0
  # Saving takes into Photos / MediaStore
  gal: ^2.3.0
  video_player: ^2.9.0
  # Device / system info
  battery_plus: ">=6.0.0 <8.0.0"
  device_info_plus: ">=10.0.0 <13.0.0"
  package_info_plus: ">=8.0.0 <10.0.0"
  permission_handler: ">=11.3.0 <13.0.0"
  wakelock_plus: ">=1.2.0 <2.0.0"
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  ffi: ^2.1.0
  # Camera Motion Sync (gravity → roll)
  sensors_plus: ">=6.0.0 <8.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
