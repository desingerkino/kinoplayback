name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Bootstrap platform folders (only if missing)
        id: bootstrap
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=ios,android --org com.desingerkino --project-name kinoplayback --no-pub .
            rm -f test/widget_test.dart
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          python3 tool/patch_platforms.py
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Unit & widget tests
        run: flutter test --reporter expanded
      - name: Commit generated platform folders
        if: steps.bootstrap.outputs.created == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios .metadata
          git commit -m "Bootstrap ios/ and android/ via flutter create + tool/patch_platforms.py" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

  android:
    name: Android APK / AAB
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Bootstrap platform folders (only if missing)
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=ios,android --org com.desingerkino --project-name kinoplayback --no-pub .
            rm -f test/widget_test.dart
          fi
          python3 tool/patch_platforms.py
      - run: flutter pub get
      - name: Build APK (release, debug-signed for sideload testing)
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Build AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Verify APK is a real package
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E "AndroidManifest.xml|classes.dex|lib/arm64-v8a/libflutter.so"
          mkdir -p dist
          cp "$APK" dist/KinoPlayback-${{ github.run_number }}.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/KinoPlayback-${{ github.run_number }}.aab
      - uses: actions/upload-artifact@v4
        with:
          name: kinoplayback-android-${{ github.run_number }}
          path: dist/*
          retention-days: 30

  ios:
    name: iOS (unsigned IPA)
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Bootstrap platform folders (only if missing)
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=ios,android --org com.desingerkino --project-name kinoplayback --no-pub .
            rm -f test/widget_test.dart
          fi
      - run: flutter pub get
      - name: Generate iOS config (creates Podfile), then patch
        run: |
          flutter build ios --config-only --release --no-codesign
          python3 tool/patch_platforms.py
          cd ios && pod install --repo-update
      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Package unsigned IPA (for Sideloadly / re-signing)
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qry KinoPlayback-${{ github.run_number }}-unsigned.ipa Payload && rm -rf Payload
          ls -la
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" ../build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" ../build/ios/iphoneos/Runner.app/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: kinoplayback-ios-${{ github.run_number }}
          path: dist/*.ipa
          retention-days: 30
