name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Bootstrap platform folders (only if missing)
        id: bootstrap
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=ios,android --org com.desingerkino --project-name kinoplayback --no-pub .
            rm -f test/widget_test.dart
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          python3 tool/patch_platforms.py
      - name: Pub get
        run: |
          mkdir -p logs
          set -o pipefail
          flutter pub get 2>&1 | tee logs/pub_get.log
          flutter pub deps --style=compact > logs/pub_deps.log 2>&1 || true
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee logs/analyze.log
      - name: Unit & widget tests
        run: |
          set -o pipefail
          flutter test --reporter expanded --exclude-tags golden 2>&1 | tee logs/test.log
      - name: Screen renders (goldens) for layout review
        continue-on-error: true
        run: |
          flutter test --reporter expanded --tags golden --update-goldens 2>&1 | tee logs/goldens.log || true
          mkdir -p logs/goldens && cp test/goldens/*.png logs/goldens/ || true
          grep -q "All tests passed" logs/goldens.log
      - name: Commit generated platform folders
        if: steps.bootstrap.outputs.created == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android ios
          [ -f .metadata ] && git add .metadata
          git commit -m "Bootstrap ios/ and android/ via flutter create + tool/patch_platforms.py" || exit 0
          git pull --rebase --autostash origin main 2>&1 | tee -a logs/bootstrap_commit.log
          git push origin HEAD:main 2>&1 | tee -a logs/bootstrap_commit.log
      - name: Publish logs to ci-logs-analyze-test branch
        if: always() && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs /tmp/cilogs
          cp -R logs/. /tmp/cilogs/ || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} job=${{ github.job }}" > /tmp/cilogs/RUN.txt
          cd /tmp/cilogs
          git init -q
          git checkout -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "logs ${{ github.run_id }} ${{ github.job }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ci-logs:ci-logs-analyze-test

  android:
    name: Android APK / AAB
    needs: analyze-test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Bootstrap platform folders (only if missing)
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=ios,android --org com.desingerkino --project-name kinoplayback --no-pub .
            rm -f test/widget_test.dart
          fi
          python3 tool/patch_platforms.py
      - run: flutter pub get
      - name: Build APK (release, debug-signed for sideload testing)
        run: |
          mkdir -p logs
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee logs/build_apk.log
      - name: Build arm64 APK (smaller, for modern phones)
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64 --build-number=${{ github.run_number }} 2>&1 | tee logs/build_apk_arm64.log
      - name: Build AAB
        run: |
          set -o pipefail
          flutter build appbundle --release --build-number=${{ github.run_number }} 2>&1 | tee logs/build_aab.log
      - name: Verify APK is a real package
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E "AndroidManifest.xml|classes.dex|lib/arm64-v8a/libflutter.so"
          mkdir -p dist
          cp "$APK" dist/KinoPlayback-${{ github.run_number }}-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/KinoPlayback-${{ github.run_number }}-arm64.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/KinoPlayback-${{ github.run_number }}.aab
      - uses: actions/upload-artifact@v4
        with:
          name: kinoplayback-android-${{ github.run_number }}
          path: dist/*
          retention-days: 30
      - name: Publish logs to ci-logs-android branch
        if: always() && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs /tmp/cilogs
          cp -R logs/. /tmp/cilogs/ || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} job=${{ github.job }}" > /tmp/cilogs/RUN.txt
          cd /tmp/cilogs
          git init -q
          git checkout -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "logs ${{ github.run_id }} ${{ github.job }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ci-logs:ci-logs-android

  ios:
    name: iOS (unsigned IPA)
    needs: analyze-test
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Bootstrap platform folders (only if missing)
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=ios,android --org com.desingerkino --project-name kinoplayback --no-pub .
            rm -f test/widget_test.dart
          fi
      - run: flutter pub get
      - name: Generate iOS config (creates Podfile), then patch
        run: |
          mkdir -p logs
          set -o pipefail
          flutter build ios --config-only --release --no-codesign 2>&1 | tee logs/ios_config.log
          python3 tool/patch_platforms.py 2>&1 | tee -a logs/ios_config.log
          # All plugins may resolve through Swift Package Manager; CocoaPods
          # is only needed when Flutter generated a Podfile.
          if [ -f ios/Podfile ]; then
            cp ios/Podfile logs/Podfile.txt
            (cd ios && pod install --repo-update) 2>&1 | tee logs/pod_install.log
          else
            echo "no Podfile: plugins via Swift Package Manager" | tee logs/pod_install.log
          fi
      - name: Build iOS app (no codesign)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }} 2>&1 | tee logs/build_ios.log
      - name: Package unsigned IPA (for Sideloadly / re-signing)
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qry KinoPlayback-${{ github.run_number }}-unsigned.ipa Payload && rm -rf Payload
          ls -la
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" ../build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" ../build/ios/iphoneos/Runner.app/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: kinoplayback-ios-${{ github.run_number }}
          path: dist/*.ipa
          retention-days: 30
      - name: Publish logs to ci-logs-ios branch
        if: always() && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs /tmp/cilogs
          cp -R logs/. /tmp/cilogs/ || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} job=${{ github.job }}" > /tmp/cilogs/RUN.txt
          cd /tmp/cilogs
          git init -q
          git checkout -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "logs ${{ github.run_id }} ${{ github.job }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ci-logs:ci-logs-ios

