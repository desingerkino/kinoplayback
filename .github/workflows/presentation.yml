name: Presentation video

# Видеопрезентация с мужской озвучкой на русском (ru-RU-DmitryNeural).
# Текст и озвучка лежат в tool/presentation/slides.yaml.
# Результат: Actions -> этот прогон -> Artifacts -> kinoplayback-presentation.

on:
  push:
    branches: ["presentation/**"]
    paths:
      - "tool/presentation/**"
      - ".github/workflows/presentation.yml"
  workflow_dispatch:

jobs:
  video:
    name: Build presentation video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyyaml edge-tts
          ffmpeg -version | head -1
      - name: Build video
        run: python tool/presentation/build.py --out build/presentation
      - uses: actions/upload-artifact@v4
        with:
          name: kinoplayback-presentation
          path: |
            build/presentation/KINO_PLAYBACK_presentation.mp4
            build/presentation/slide_*.png
          if-no-files-found: error
