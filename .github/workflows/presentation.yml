name: Presentation video

# Видеопрезентация с мужской озвучкой на русском (ru-RU-DmitryNeural).
# Текст и озвучка лежат в tool/presentation/slides.yaml.
# Результат: Actions -> этот прогон -> Artifacts -> kinoplayback-presentation.

on:
  push:
    branches: ["presentation/**"]
    paths:
      - "tool/presentation/**"
      - ".github/workflows/presentation.yml"
  workflow_dispatch:

jobs:
  video:
    name: Build presentation video
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyyaml numpy edge-tts
      - name: Build video
        run: |
          set +e
          python -u tool/presentation/build.py --out build/presentation > build.log 2>&1
          code=$?
          tail -40 build.log
          if [ $code -ne 0 ]; then
            msg=$(tail -25 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: kinoplayback-presentation
          path: build/presentation/KINO_PLAYBACK_presentation.mp4
          if-no-files-found: error
      - name: Publish MP4 to branch presentation-build
        if: success()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out
          cp build/presentation/KINO_PLAYBACK_presentation.mp4 /tmp/out/
          cp build.log /tmp/out/build.log
          cd /tmp/out
          git init -q
          git checkout -q -b presentation-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Presentation build from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f origin presentation-build
